name: 領富 AI · 每日資料更新

# 每天台灣時間 15:00（UTC 07:00）跑一次
# TPEx 收盤後資料才會就緒，14:30 後 OK
on:
  schedule:
    - cron: "0 7 * * 1-5"   # 週一到週五
  workflow_dispatch:         # 允許手動觸發

permissions:
  contents: write            # 讓 Action 可以 commit 回 main
  actions: write             # 讓 Action 可主動觸發 deploy-worker（資料更新後重新部署 worker，AI/網站才讀得到新資料）

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all fetchers
        run: python scripts/run_all.py
        env:
          PYTHONIOENCODING: utf-8

      # 新聞抓完後，用 AI 幫每則標「利多/利空、短/長期、影響個股」，寫回 news_live.json。
      # 失敗不擋整體更新（當天新聞就只是少了 AI 標註）。呼叫線上 /api/ask，無需 secret。
      - name: AI 新聞判斷
        continue-on-error: true
        run: python scripts/analyze_news.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Show data summary
        run: |
          echo "=== data/ files ==="
          ls -la data/
          echo ""
          echo "=== stocks_live.json header ==="
          python -c "import json; d=json.load(open('data/stocks_live.json')); print(f\"updatedAt: {d.get('updatedAt')}\"); print(f\"stockCount: {d.get('stockCount')}\")"

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "leadfu-ai-bot"
          git config user.email "bot@leadfu.ai"
          # run_all.py 也會重生根目錄 sitemap*.xml 與 pages/industries/，
          # 只 add data/ 會讓它們變成「未暫存變更」→ 下面 push 失敗後的 rebase
          # 直接 exit 128、整輪作廢（2026-06-17 起天天失敗、資料凍結 71 天的主因）。
          git add data/ 2>/dev/null || true
          git add sitemap.xml sitemap-pages.xml sitemap-stocks.xml sitemap-content.xml 2>/dev/null || true
          git add pages/industries/ 2>/dev/null || true
          # 只有真的有 diff 才 commit，避免空 commit
          if ! git diff --staged --quiet; then
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "data: 每日更新 ($DATE)"
            # 防推送競態：長任務期間 main 可能被推前（2026-06-11 整輪作廢主因）
            # rebase -X theirs：資料檔以本輪新抓的為準
            for i in 1 2 3; do
              git push && break
              echo "push 被拒（第 $i 次），rebase 後重試…"
              git pull --rebase --autostash -X theirs origin main
            done
            echo "✅ 已 commit 並 push"
            # ⚠ GITHUB_TOKEN 推的 commit 不會自動觸發 deploy-worker（GitHub 防遞迴）。
            #    這裡主動觸發一次部署，讓 worker 的 ASSETS（LINE AI 客服 + 網站讀的 stocks_live 等）更新到最新資料。
            gh workflow run deploy-worker.yml && echo "🚀 已觸發 worker 部署" || echo "⚠ 觸發 worker 部署失敗（資料已 commit，但 worker 未自動重部署）"
          else
            echo "ℹ️ 無變動，跳過 commit"
          fi
