name: 領富 AI · 盤前新聞抓取（清晨先備好，Cloudflare 負責推播）

# 盤前新聞「推播」已改由 Cloudflare Cron（worker scheduled，08:30 台北精準）負責，
# 不再受 GitHub Actions 排程延遲影響（原本 07:40 排程常拖到 09:30、開盤後才送達）。
# 這支只負責「清晨把最新（含隔夜）新聞抓好 + 部署到站」，讓 08:30 的 Cloudflare 推播讀到早上的最新新聞。
# 排 05:00 台北（UTC 前一日 21:00）：即使 GitHub 排程延遲 1-2 小時，也能在 08:30 推播前備妥。
on:
  schedule:
    - cron: "0 21 * * 0-4"   # 週日~週四 21:00 UTC = 週一~週五 05:00 台北
  workflow_dispatch:

jobs:
  premarket-news-fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1) 抓最新新聞（覆蓋 news_live.json）；失敗不擋（會留既有新聞）
      - name: Fetch latest news
        continue-on-error: true
        run: python scripts/fetch_news.py
        env:
          PYTHONIOENCODING: utf-8

      # 2) AI 標註利多/利空（可失敗，失敗就少了標註）
      - name: AI tag news
        continue-on-error: true
        run: python scripts/analyze_news.py
        env:
          PYTHONIOENCODING: utf-8

      # 3) commit 早上抓的新聞 + 觸發部署，讓 worker ASSETS（網站/AI/盤前推播讀的新聞）更新到最新
      #    推播本身由 Cloudflare Cron（08:30 台北）讀這份已部署的 news_live.json 來發送。
      - name: Commit fresh morning news & deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news_live.json data/announcements_live.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "無新聞變動，略過 commit"
          else
            git commit -m "data: 盤前新聞清晨更新 ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin main || true
            git push || true
            gh workflow run deploy-worker.yml && echo "🚀 已觸發 worker 部署（08:30 Cloudflare 推播前備妥）" || echo "⚠ 觸發部署失敗"
          fi
