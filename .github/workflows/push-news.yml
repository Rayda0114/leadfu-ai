name: 領富 AI · 每日新聞推播

# 台灣時間 15:50（UTC 07:50）—— 排在「每日資料更新」(15:00，含 fetch_news) 之後、與其他推播同批。
# 讀會員 news_subs（勾選的主題、active=true）→ 比對今日新聞 → 把相符主題透過 LINE 推播。
on:
  schedule:
    - cron: "50 7 * * 1-5"   # 週一到週五，資料更新後
  workflow_dispatch:           # 允許手動觸發（測試用）
    inputs:
      dry_run:
        description: "只測試、不實際推播/不回寫（true = 只印訊息）"
        required: false
        default: "true"

jobs:
  push-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Push daily news digest to members
        run: python scripts/push_news_digest.py
        env:
          PYTHONIOENCODING: utf-8
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          PUSH_SLOT: post   # 盤後（這支 15:50 跑）
          # 手動觸發 dry_run=true → 只印不推；排程觸發為空 → 實際推播
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
