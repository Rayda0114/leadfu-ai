name: TEST · ETF 抓取 IP 驗證（臨時）

# 臨時測試：驗證 GitHub Actions 機房 IP 能否抓到 mis.twse + 6 家投信 ETF 資料
# 只跑 ETF/法說會抓取器、印出成敗、不 commit。測完即刪。
on:
  workflow_dispatch:

jobs:
  test-etf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 跑 ETF 抓取器（不 commit）
        env:
          PYTHONIOENCODING: utf-8
        run: |
          for s in fetch_etf_nav fetch_etf_basic fetch_etf_holdings fetch_etf_dividend fetch_conference; do
            echo "==================== $s ===================="
            python scripts/$s.py || echo "❌ $s 例外退出 (exit $?)"
          done
