name: 領富 AI · 期交所晚間補抓（大盤溫度計）

# 期交所資料分兩波發布：① 台指期收盤/三大法人(外資淨部位)/選擇權 P-C 約 15:00–16:00 出；
# ② 大額交易人(前十大)晚間才出。15:00 主排程偏早常抓到前一天，故這支補抓兩次：
#   17:00 台北（UTC 09:00）→ 大盤溫度計當天下午就顯示今日(收盤/外資/PC/風險等級)；
#   22:30 台北（UTC 14:30）→ 補齊晚間才發布的「大額交易人」，並讓隔晨 07:00 大盤風險推播吃到完整資料。
on:
  schedule:
    - cron: "0 9 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh-taifex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch TAIFEX
        run: python scripts/fetch_taifex.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "leadfu-ai-bot"
          git config user.email "bot@leadfu.ai"
          git add data/taifex_live.json data/_taifex_alert.json 2>/dev/null || git add data/taifex_live.json
          if ! git diff --staged --quiet; then
            git commit -m "data(taifex): 晚間補抓 $(date -u +%F)"
            for i in 1 2 3; do
              git push && break
              echo "push 被拒，rebase 重試…"
              git pull --rebase -X theirs origin main
            done
            gh workflow run deploy-worker.yml && echo "🚀 已觸發 worker 部署" || echo "⚠ 部署觸發失敗"
          else
            echo "ℹ️ 無變動"
          fi
