name: 領富 AI · 美股精選 100 每日報價更新

# 每天美股收盤後抓報價：UTC 21:30
#   = 美東 17:30 (夏令 EDT) / 16:30 (冬令 EST)
#   = 台北 05:30 隔日
# 美股交易日 = 週一到週五；cron 用美東當日對應的 UTC（週一到週五一致）
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:        # 允許手動觸發

permissions:
  contents: write           # 讓 Action 可以 commit 回 main

jobs:
  fetch-us-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Fetch US snapshot
        run: python scripts/fetch_us_snapshot.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Show summary
        run: |
          echo "=== data/us_stocks_live.json header ==="
          python -c "import json; d=json.load(open('data/us_stocks_live.json')); print(f\"updatedAt: {d.get('updatedAt')}\"); print(f\"count: {d.get('count')}/{d.get('expected')}\"); print(f\"errors: {len(d.get('errors', []))}\")"

      - name: Commit if changed
        run: |
          git config user.name "leadfu-ai-bot"
          git config user.email "bot@leadfu.ai"
          git add data/us_stocks_live.json
          # 只有真的有 diff 才 commit
          if ! git diff --staged --quiet; then
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "data: 美股 100 檔報價更新 ($DATE)"
            git push
            echo "✅ 已 commit 並 push"
          else
            echo "ℹ️ 無變動，跳過 commit"
          fi
