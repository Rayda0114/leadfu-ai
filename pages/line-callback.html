<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINE 登入中… - 領富 AI</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="stylesheet" href="../css/style.css">
<style>
  .lc-wrap{max-width:440px;margin:8vh auto;padding:0 20px;text-align:center;}
  .lc-card{background:#fff;border:1px solid #e5e0d5;border-radius:14px;padding:40px 28px;box-shadow:0 8px 30px rgba(27,67,50,.07);}
  .lc-logo{font-weight:800;font-size:22px;color:#1B4332;margin-bottom:18px;}
  .lc-logo .ai{color:#B08D57;}
  .lc-spin{width:42px;height:42px;border:4px solid #e5e0d5;border-top-color:#06C755;border-radius:50%;margin:8px auto 18px;animation:lcspin 0.9s linear infinite;}
  @keyframes lcspin{to{transform:rotate(360deg);}}
  .lc-msg{color:#555;font-size:15px;line-height:1.7;}
  .lc-err{color:#b3261e;font-size:15px;line-height:1.7;}
  .lc-btn{display:inline-block;margin-top:18px;background:#1B4332;color:#fff;font-weight:700;padding:11px 26px;border-radius:8px;text-decoration:none;}
</style>
</head>
<body>
<div class="lc-wrap">
  <div class="lc-card">
    <div class="lc-logo">領富 <span class="ai">AI</span></div>
    <div id="lcBody">
      <div class="lc-spin"></div>
      <div class="lc-msg">正在完成 LINE 登入，請稍候…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/auth.js"></script>
<script>
(async () => {
  const bodyEl = document.getElementById("lcBody");
  const fail = (msg) => {
    bodyEl.innerHTML =
      '<div class="lc-err">😕 ' + msg + '</div>' +
      '<a class="lc-btn" href="login.html">回登入頁重試</a>';
  };

  try {
    const params = new URLSearchParams(window.location.search);
    const err = params.get("error");
    if (err) {
      // 使用者在 LINE 端取消授權，或 LINE 回傳錯誤
      return fail(err === "access_denied"
        ? "你取消了 LINE 授權。"
        : "LINE 授權未完成（" + err + "）。");
    }

    const code = params.get("code");
    const state = params.get("state");
    if (!code) return fail("沒有收到授權碼，請重新登入。");

    // CSRF：比對先前存的 state（隱私模式可能沒存，沒存就略過比對）
    let expected = null;
    try { expected = sessionStorage.getItem("line_login_state"); } catch (e) {}
    if (expected && state && expected !== state) {
      return fail("登入驗證碼不符，為安全起見已中止，請重新登入。");
    }

    // 把 code 交給 Worker 換 Supabase session token（同源 /api/line-auth）
    const res = await fetch("/api/line-auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.token_hash) {
      return fail("登入處理失敗" + (data.error ? "：" + data.error : "") + "，請稍後再試。");
    }

    // 用 token_hash 建立正式 Supabase session
    const sb = window.LeadFuAuth.client;
    const { error: voErr } = await sb.auth.verifyOtp({
      token_hash: data.token_hash,
      type: "magiclink"
    });
    if (voErr) {
      return fail("建立登入狀態失敗（" + (voErr.message || voErr) + "），請重新登入。");
    }

    // 成功 → 清掉 state，導去目的頁
    let next = "/pages/member.html";
    try {
      next = sessionStorage.getItem("line_login_next") || next;
      sessionStorage.removeItem("line_login_state");
      sessionStorage.removeItem("line_login_next");
    } catch (e) {}
    window.location.replace(next);
  } catch (e) {
    fail("發生未預期錯誤（" + (e && e.message ? e.message : e) + "）。");
  }
})();
</script>
</body>
</html>
