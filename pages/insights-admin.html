<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>站長後台 · 選題草稿審核 - 領富 AI</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="stylesheet" href="../css/style.css?v=3.23.9">
<style>
  .ad-wrap{max-width:980px;margin:0 auto;padding:24px 16px 80px;}
  .ad-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:8px;}
  .ad-title{font-size:22px;font-weight:800;color:#1B4332;}
  .ad-title .ai{color:#B08D57;}
  .ad-sub{color:#777;font-size:13px;margin-bottom:18px;line-height:1.6;}
  .ad-warn{background:#fdf3e7;border:1px solid #e8c99a;color:#8a5a1b;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:18px;line-height:1.6;}
  .ad-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .ad-chip{border:1px solid #d9d5cc;background:#fff;color:#555;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;}
  .ad-chip.on{background:#1B4332;color:#fff;border-color:#1B4332;}
  .ad-refresh{margin-left:auto;border:1px solid #d9d5cc;background:#fff;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;color:#1B4332;}
  .ad-card{background:#fff;border:1px solid #e8e4db;border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(27,67,50,.04);}
  .ad-row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .ad-th{font-weight:800;font-size:17px;color:#1B4332;flex:1;min-width:200px;}
  .ad-id{color:#aaa;font-size:12px;}
  .ad-st{font-size:12px;border-radius:6px;padding:3px 10px;font-weight:700;}
  .ad-st.draft{background:#eef1f4;color:#5a6b7a;}
  .ad-st.pending_review{background:#fff4e0;color:#9a6b1b;}
  .ad-st.published{background:#e6f4ea;color:#1e7e34;}
  .ad-st.rejected{background:#fbeaea;color:#b23b3b;}
  .ad-thesis{color:#333;font-size:14px;line-height:1.7;margin-bottom:12px;white-space:pre-wrap;}
  .ad-sec{font-size:12px;color:#666;margin-bottom:6px;}
  .ad-sec b{color:#1B4332;}
  .ad-tag{display:inline-block;background:#f3f0e8;color:#7a6a44;border-radius:5px;padding:1px 7px;margin:2px 3px 2px 0;font-size:11px;}
  .ad-tag.risk{background:#fbeaea;color:#a23;}
  .ad-tag.nv{background:#fff4e0;color:#9a6b1b;}
  .ad-flags{font-size:11px;color:#888;background:#fafafa;border:1px dashed #ddd;border-radius:6px;padding:6px 10px;margin:8px 0;}
  /* 把關狀態：原本只丟 JSON.stringify(quality_flags)，出事時看不出卡在哪 */
  .ad-gate{border-radius:8px;padding:10px 13px;margin:8px 0;font-size:13px;line-height:1.7;border:1px solid;}
  .ad-gate.fail{background:#fbeae8;border-color:#eccac4;color:#8c2f24;}
  .ad-gate.wait{background:#fdf2dd;border-color:#eeddb4;color:#7a5a18;}
  .ad-gate.pass{background:#e4efe8;border-color:#c6ddcf;color:#1a5c3a;}
  .ad-gate.rej {background:#eee;border-color:#ddd;color:#666;}
  .ad-gate b{font-weight:800;}
  .ad-gate .g-why{display:block;margin-top:3px;}
  .ad-gate .g-sub{display:block;margin-top:5px;font-size:11.5px;opacity:.8;}
  details.ad-vr{margin:10px 0;border:1px solid #d9e3dc;border-radius:8px;background:#fbfcfb;}
  details.ad-vr>summary{cursor:pointer;padding:9px 12px;font-size:13px;color:#1B4332;font-weight:700;}
  details.ad-vr>summary b.bad{color:#b23b3b;}
  .ad-vrmuted{color:#999;font-weight:400;font-size:11px;margin-left:6px;}
  .ad-vrbody{padding:2px 12px 10px;}
  .ad-vrow{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.6;padding:4px 6px;border-top:1px solid #f0eee8;border-radius:4px;}
  .ad-vrow.bad{background:#fdecec;}
  .ad-vrow.num{background:#fff7e6;}
  .ad-vck{flex:0 0 auto;}
  .ad-vmain{flex:1;color:#444;}
  .ad-vrow a{flex:0 0 auto;color:#1B4332;font-size:11px;white-space:nowrap;}
  .ad-vrbasis{color:#aaa;font-size:11px;margin-top:8px;line-height:1.5;}
  .ad-vchips{color:#5a6b7a;font-size:11px;margin-top:2px;background:#eef2f6;border-radius:4px;padding:1px 6px;display:inline-block;}
  .ad-vref{color:#1B4332;font-weight:600;}
  details.ad-brief{margin:10px 0;border:1px solid #eee;border-radius:8px;}
  details.ad-brief>summary{cursor:pointer;padding:8px 12px;font-size:13px;color:#1B4332;background:#f8f7f3;border-radius:8px;}
  .ad-briefbody{padding:8px 16px;font-size:13px;line-height:1.7;max-height:380px;overflow:auto;color:#444;}
  .ad-briefbody table{border-collapse:collapse;width:100%;font-size:12px;}
  .ad-briefbody th,.ad-briefbody td{border:1px solid #e3e0d8;padding:4px 8px;text-align:left;}
  .ad-lbl{font-size:12px;color:#777;margin:12px 0 4px;font-weight:700;}
  textarea.ad-art{width:100%;min-height:240px;border:1px solid #cfd6cf;border-radius:8px;padding:12px;font-size:14px;line-height:1.7;font-family:inherit;resize:vertical;box-sizing:border-box;}
  input.ad-slug,input.ad-metadesc{width:100%;border:1px solid #cfd6cf;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;box-sizing:border-box;}
  .ad-pub-url{color:#1B6b40;font-weight:600;text-decoration:none;}
  .ad-pub-url:hover{text-decoration:underline;}
  .ad-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;}
  .ad-b{border:0;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;}
  .ad-b.save{background:#3a6b50;color:#fff;}
  .ad-b.pub{background:#1B4332;color:#fff;}
  .ad-b.rej{background:#fff;color:#b23b3b;border:1px solid #e3b3b3;}
  .ad-b.prev{background:#fff;color:#1B4332;border:1px solid #cfd6cf;}
  .ad-b.retry{background:#fff;color:#8a6d1f;border:1px solid #e3d3a6;}
  .ad-b:disabled{opacity:.5;cursor:not-allowed;}
  .ad-msg2{font-size:12px;color:#1e7e34;margin-left:6px;}
  .ad-msg2.err{color:#b23b3b;}
  .ad-state{text-align:center;padding:60px 20px;color:#888;}
  .ad-state .ad-icon{font-size:42px;margin-bottom:14px;}
  .ad-btn{display:inline-block;background:#1B4332;color:#fff;font-weight:700;padding:11px 26px;border-radius:8px;text-decoration:none;margin-top:8px;}
  .ad-link{display:inline-block;margin-top:12px;color:#1B4332;font-size:13px;}
  .ad-prevbox{border:1px solid #e3e0d8;border-radius:8px;padding:12px 16px;margin-top:10px;font-size:14px;line-height:1.8;background:#fffdf8;display:none;}
</style>
</head>
<body>
<div class="ad-wrap">
  <div class="ad-head">
    <div class="ad-title">領富 <span class="ai">AI</span> · 選題草稿審核</div>
    <a href="/" style="color:#1B4332;font-size:13px;">← 回首頁</a>
  </div>
  <div class="ad-sub">選題引擎送進來的「題材方向」一律是草稿。請用真實來源（公司法說會、重訊、財報）查證後，把正式文章寫進 <code>article_md</code>，再人工發佈。僅站長本人可見。</div>
  <div class="ad-warn">⚠️ <b>YMYL 財經內容硬性規則</b>：brief 只是方向探勘，不可當事實照抄。每個 <span class="ad-tag nv">needs_verify</span> 與數字都要逐一核對來源；發佈的文章須標「AI 輔助選題、經編輯查證」並附免責聲明。</div>

  <div id="adBody">
    <div class="ad-state"><div class="ad-icon">⏳</div>載入中…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="../js/auth.js?v=3.30.0"></script>
<script>
(async () => {
  const body = document.getElementById("adBody");
  const sb = window.LeadFuAuth.client;
  // worker.js OWNER_UIDS（純前端友善訊息用；真正權限由 Supabase RLS owner_all 把關）
  const OWNER_UIDS = [
    "5f5a8d9a-4fa6-4b38-a110-8211edc970e0",
    "1f5502ba-7d0a-427f-936f-bbc8b445b03e",
    "697c1764-e500-42e5-9266-c844fb587890"
  ];

  const esc = (s) => (s == null ? "" : String(s).replace(/[&<>"']/g, c => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])));
  const md2html = (s) => { try { return window.marked ? window.marked.parse(String(s||"")) : esc(s).replace(/\n/g,"<br>"); } catch(e){ return esc(s); } };
  const stateHtml = (icon, msg, extra) =>
    `<div class="ad-state"><div class="ad-icon">${icon}</div><div>${msg}</div>${extra || ""}</div>`;

  // 1) 登入 + owner 檢查（友善訊息；資料層仍由 RLS 保護）
  let user = null;
  try { user = (await sb.auth.getUser()).data.user; } catch (e) {}
  if (!user) {
    body.innerHTML = stateHtml("🔒", "請先用<strong>站長帳號</strong>登入。",
      `<div><a class="ad-btn" href="login">會員登入 →</a></div>`);
    return;
  }
  if (!OWNER_UIDS.includes(user.id)) {
    body.innerHTML = stateHtml("🚫", "此帳號無權限（請用站長帳號登入）。",
      `<div><a class="ad-link" href="#" id="adLogout">登出，改用其他帳號 →</a></div>`);
    const lo = document.getElementById("adLogout");
    if (lo) lo.addEventListener("click", async (e) => { e.preventDefault(); try { await sb.auth.signOut(); } catch (e2) {} location.href = "login"; });
    return;
  }

  let filter = "todo";  // todo = draft + pending_review
  const FILTERS = { todo:"待處理", draft:"草稿", pending_review:"待覆核", published:"已發佈", rejected:"已退回" };

  async function load() {
    body.innerHTML = stateHtml("⏳", "載入草稿中…");
    let q = sb.from("mirofish_briefs").select("*").order("created_at", { ascending: false });
    if (filter === "todo") q = q.in("status", ["draft", "pending_review"]);
    else q = q.eq("status", filter);
    const { data, error } = await q;
    if (error) {
      body.innerHTML = stateHtml("😕", "讀取失敗：" + esc(error.message),
        `<div><a class="ad-link" href="#" onclick="location.reload();return false;">重新整理</a></div>`);
      return;
    }
    render(data || []);
  }

  function render(rows) {
    const chips = Object.keys(FILTERS).map(k =>
      `<button class="ad-chip ${k===filter?"on":""}" data-f="${k}">${FILTERS[k]}</button>`).join("");
    const list = rows.length === 0
      ? `<div class="ad-state"><div class="ad-icon">📭</div>此分類目前沒有資料。</div>`
      : rows.map(cardHtml).join("");
    body.innerHTML =
      `<div class="ad-bar">${chips}<button class="ad-refresh" id="adRefresh">↻ 重新整理</button></div>` +
      `<div style="color:#999;font-size:12px;margin-bottom:10px;">共 ${rows.length} 筆</div>` + list;

    body.querySelectorAll(".ad-chip").forEach(ch =>
      ch.addEventListener("click", () => { filter = ch.dataset.f; load(); }));
    document.getElementById("adRefresh").addEventListener("click", load);
    rows.forEach(wireCard);
  }

  // 自動把關（worker 的 runInsightAutopilot）的結果。原本這段只被 JSON.stringify 印出來，
  // 稿子沒發時得自己讀 JSON 才知道卡在哪——這是「為什麼都沒自動發文」最常見的答案來源。
  const GATE_STAGE = {
    "L1-brief":   "L1 大綱禁用詞",
    "L2-facts":   "L2 事實查核（代號↔名稱）",
    "write":      "AI 寫稿",
    "L1-article": "L1 正文禁用詞",
    "L3-ai":      "L3 Gemini 獨立審查",
  };
  const fmtWhen = (d) => {
    const p2 = (n) => String(n).padStart(2, "0");
    return `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  };
  // 只有「被自動把關擋下」才給重送按鈕；人工退稿的不給（那是站長自己的決定）。
  const gateFailed = (r) => {
    const g = (r.quality_flags && r.quality_flags.gate) || null;
    return !!(g && g.stage_failed && !g.rejected_at);
  };
  function gateHtml(r) {
    const g = (r.quality_flags && r.quality_flags.gate) || null;
    if (!g) return r.status === "draft"
      ? `<div class="ad-gate wait">⏳ <b>尚未進入自動把關</b><span class="g-sub">每 10 分鐘一輪；剛送進來的草稿要等下一輪。</span></div>`
      : "";
    if (g.rejected_at) return `<div class="ad-gate rej">🚫 <b>已退稿</b>（${esc(String(g.rejected_via || "未註明來源"))}）<span class="g-sub">${esc(String(g.rejected_at).slice(0, 16).replace("T", " "))}</span></div>`;
    if (g.stage_failed) {
      const retry = Number(g.attempts || 0) < 2;
      return `<div class="ad-gate fail">❌ <b>沒過把關，所以沒有自動發佈</b>
        <span class="g-why">卡在：<b>${esc(GATE_STAGE[g.stage_failed] || g.stage_failed)}</b></span>
        <span class="g-why">原因：${esc((g.reasons || []).join("；") || "（未提供）")}</span>
        <span class="g-sub">已試 ${esc(String(g.attempts || 1))} 次${retry ? "，下一輪還會再試" : "，已停止重試（上限 2 次）"}
        ${g.checked_at ? "・" + esc(String(g.checked_at).slice(0, 16).replace("T", " ")) : ""}
        ${retry ? "" : "。要救回來：在下面手動改掉觸發的字，再按發佈。"}</span></div>`;
    }
    if (g.publish_after) {
      const due = new Date(g.publish_after);
      const left = Math.round((due - Date.now()) / 60000);
      return `<div class="ad-gate ${left > 0 ? "wait" : "pass"}">${left > 0 ? "⏳" : "✅"} <b>已通過三層把關</b>
        <span class="g-sub">${left > 0
          // ⚠ 不要用 toLocaleString(...).slice(0,16)——會切在秒的中間，變成「16:00:1」。
          ? `冷卻中，約 ${left} 分鐘後（${esc(fmtWhen(due))}）自動發佈；不想發就按下面的退稿。`
          : "冷卻期已過，下一輪 cron 會自動發佈。"}</span></div>`;
    }
    return "";
  }
  // gate 以外的旗標（上游 brief 自帶的）仍保留原始 JSON，除錯時有用。
  function otherFlagsHtml(r) {
    const qf = r.quality_flags;
    if (!qf || typeof qf !== "object") return "";
    const rest = Object.assign({}, qf); delete rest.gate;
    return Object.keys(rest).length
      ? `<div class="ad-flags">其他品質旗標：${esc(JSON.stringify(rest))}</div>` : "";
  }

  function verifyReportHtml(vr) {
    if (!vr || typeof vr !== "object") return "";
    if (vr.error) return `<details class="ad-vr"><summary class="ad-vrhead">🔍 AI 查證清單</summary><div class="ad-vrbody"><div class="ad-vrbasis">查證未產生：${esc(vr.error)}</div></div></details>`;
    const c = vr.ticker_summary || {};
    const items = Array.isArray(vr.items) ? vr.items : [];
    const icon = (v) => v === "ok" ? "✅" : v === "ok_name_unknown" ? "☑️" : v === "mismatch" ? "⚠️" : v === "not_found" ? "❓" : "•";
    const rows = items.map(it => {
      const bad = it.verdict === "mismatch" || it.verdict === "not_found";
      const code = esc(it.code || "");
      const link = code ? `<a href="/stock/${code}" target="_blank" rel="noopener">查官方資料 ↗</a>` : "";
      const val = it.valuation_label ? `　估值:${esc(it.valuation_label)}` : "";
      const f = it.financials;
      const fin = (f && (f.gross_margin != null || f.net_margin != null))
        ? `　毛利${esc(f.gross_margin)}%／淨利${esc(f.net_margin)}%（${esc(f.year)}Q${esc(f.quarter)}）` : "";
      const chips = (it.chips && it.chips.summary) ? `<div class="ad-vchips">📊 籌碼：${esc(it.chips.summary)}</div>` : "";
      return `<div class="ad-vrow ${bad ? "bad" : ""}"><span class="ad-vck">${icon(it.verdict)}</span><span class="ad-vmain">${esc(it.note || "")}${val}${fin}${chips}</span>${link}</div>`;
    }).join("");
    const nums = vr.numbers || {};
    const ns = nums.summary || {};
    const KIND_LABEL = {
      current_price: "現價", margin_ratio: "財報比率", historical_price: "歷史股價",
      index_move: "指數漲跌", pe_multiple: "本益比/評價", share_pct: "佔比/市佔",
      market_convention: "市場慣例", forecast: "未來預估", inst_chips: "籌碼", unknown: "具體數字",
    };
    const nIcon = (v) => v === "match" ? "✅" : v === "mismatch" ? "⚠️" : v === "route" ? "🔗" : "✋";
    let numRows;
    if (Array.isArray(nums.details) && nums.details.length) {
      // 新版:逐個數字 → 分類 + 本地比對值 + 該查的官方來源連結
      numRows = nums.details.map(d => {
        const bad = d.verdict === "mismatch";
        const src = d.suggested_source || {};
        const link = src.url ? `<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.name || "官方來源")} ↗</a>`
          : (src.name ? `<span class="ad-vrmuted">查：${esc(src.name)}</span>` : "");
        const ref = d.local_ref ? `　<span class="ad-vref">站上${esc(d.local_ref.field)}：${esc(d.local_ref.value)}</span>` : "";
        return `<div class="ad-vrow num ${bad ? "bad" : ""}"><span class="ad-vck">${nIcon(d.verdict)}</span><span class="ad-vmain"><b>${esc(d.raw)}</b><span class="ad-vrmuted">[${esc(KIND_LABEL[d.kind] || d.kind)}]</span>　${esc(d.note || "")}${ref}</span>${link}</div>`;
      }).join("");
    } else {
      // 舊報告(無 details)→ 沿用原本單行摘要,不致空白
      numRows = nums.count ? `<div class="ad-vrow num"><span class="ad-vck">🔢</span><span class="ad-vmain"><b>${nums.count} 處具體數字需人工核對來源</b>：${esc((nums.samples || []).join("、"))}<br>${esc(nums.note || "")}</span></div>` : "";
    }
    const numBad = ns.mismatch || 0;
    const numHead = nums.count ? `、數字 ${nums.count} 處（<b class="${numBad ? "bad" : ""}">相符 ${ns.match || 0}、不符 ${numBad}</b>、待查 ${(ns.route || 0) + (ns.need_human || 0)}）` : "";
    const badN = (c.mismatch || 0) + (c.not_found || 0) + numBad;
    return `<details class="ad-vr" open><summary class="ad-vrhead">🔍 AI 查證清單 · 核對 ${vr.ticker_total || 0} 檔（<b class="${badN ? "bad" : ""}">配錯 ${c.mismatch || 0}、查無 ${c.not_found || 0}</b>${numHead}）<span class="ad-vrmuted">逐條以官方來源確認後再採用，非背書</span></summary><div class="ad-vrbody">${rows}${numRows}<div class="ad-vrbasis">${esc(vr.basis || "")}<br>${esc(vr.disclaimer || "")}</div></div></details>`;
  }

  function cardHtml(r) {
    const sm = r.source_meta || {};
    const secs = Array.isArray(r.sectors) ? r.sectors : [];
    const risks = Array.isArray(r.risk_notes) ? r.risk_notes : [];
    const kws = Array.isArray(r.seo_keywords) ? r.seo_keywords : [];
    const pts = Array.isArray(r.points) ? r.points : [];
    const when = r.created_at ? new Date(r.created_at).toLocaleString("zh-TW") : "";

    const secHtml = secs.length ? `<div class="ad-sec"><b>代表族群（待查證）</b>：` +
      secs.map(s => `<span class="ad-tag">${esc(s.sector||"")}${(s.sample_tickers||[]).length?"："+esc((s.sample_tickers||[]).join("/")):""}</span>`).join("") + `</div>` : "";
    const ptHtml = pts.length ? `<div class="ad-sec"><b>論點</b>：` +
      pts.map(p => `<span class="ad-tag ${p&&p.needs_verify?"nv":""}">${esc((p&&p.point)||p||"")}${p&&p.needs_verify?" ⚠":""}</span>`).join("") + `</div>` : "";
    const riskHtml = risks.length ? `<div class="ad-sec"><b>反方/風險</b>：` +
      risks.map(x => `<span class="ad-tag risk">${esc(x)}</span>`).join("") + `</div>` : "";
    const kwHtml = kws.length ? `<div class="ad-sec"><b>SEO</b>：` +
      kws.map(k => `<span class="ad-tag">${esc(k)}</span>`).join("") + `</div>` : "";
    const flags = gateHtml(r) + otherFlagsHtml(r);
    const verifyHtml = verifyReportHtml(r.verify_report);
    const briefMd = sm.brief_md ? `<details class="ad-brief"><summary>📄 展開原始 brief（選題引擎輸出，僅供方向參考）</summary><div class="ad-briefbody">${md2html(sm.brief_md)}</div></details>` : "";

    return `
      <div class="ad-card" data-id="${esc(r.id)}">
        <div class="ad-row1">
          <div class="ad-th">${esc(r.title_hint || "（無標題）")}</div>
          <span class="ad-st ${esc(r.status)}">${esc(r.status)}</span>
          <span class="ad-id">${when}</span>
        </div>
        <div class="ad-thesis">${esc(r.thesis || "")}</div>
        ${ptHtml}${secHtml}${riskHtml}${kwHtml}${verifyHtml}${flags}${briefMd}
        <div class="ad-lbl">網址 slug（選填；留空自動用編號）· 公開網址：<a class="ad-pub-url" href="/insights/${esc(r.slug || r.id)}" target="_blank" rel="noopener">/insights/${esc(r.slug || r.id)}</a></div>
        <input class="ad-slug" type="text" value="${esc(r.slug || "")}" placeholder="例：ai-compute-bottleneck（小寫英文 + 連字號，SEO 最佳；中文亦可）">
        <div class="ad-lbl">SEO 描述 meta_description（選填；留空自動用 thesis，建議 ≤155 字）</div>
        <input class="ad-metadesc" type="text" maxlength="160" value="${esc(r.meta_description || "")}" placeholder="一句話描述本文，會顯示在 Google 搜尋結果與分享卡片">
        <div class="ad-lbl">正式文章 article_md（主編查證後重寫；繁中、文末附免責）</div>
        <textarea class="ad-art" placeholder="用真實來源（法說會／重訊／財報）把上面的方向重寫成正式文章…">${esc(r.article_md || "")}</textarea>
        <div class="ad-acts">
          <button class="ad-b prev" data-act="preview">預覽</button>
          <button class="ad-b save" data-act="save">存草稿（→待覆核）</button>
          <button class="ad-b pub" data-act="publish">發佈（人工最後一步）</button>
          <button class="ad-b rej" data-act="reject">退回</button>
          ${gateFailed(r) ? `<button class="ad-b retry" data-act="retry">重送自動把關</button>` : ""}
          <span class="ad-msg2" data-role="msg"></span>
        </div>
        <div class="ad-prevbox" data-role="prev"></div>
      </div>`;
  }

  function wireCard(r) {
    const card = body.querySelector(`.ad-card[data-id="${CSS.escape(r.id)}"]`);
    if (!card) return;
    const ta = card.querySelector(".ad-art");
    const slugIn = card.querySelector(".ad-slug");
    const metaIn = card.querySelector(".ad-metadesc");
    const msg = card.querySelector('[data-role="msg"]');
    const prev = card.querySelector('[data-role="prev"]');
    const setMsg = (t, err) => { msg.textContent = t; msg.className = "ad-msg2" + (err ? " err" : ""); };
    const busy = (b) => card.querySelectorAll(".ad-b").forEach(x => x.disabled = b);
    // slug 正規化：去頭尾空白、轉小寫、空白→連字號、只留 字母/數字/連字號/中日韓字（留空 = 用 id）
    const normSlug = (s) => String(s || "").trim().toLowerCase().replace(/\s+/g, "-")
      .replace(/[^a-z0-9一-鿿-]/g, "").replace(/-+/g, "-").replace(/^-|-$/g, "");
    // slug + meta_description 一起帶進 update（slug 留空存 null → Worker 用 id 當網址）
    const seoFields = () => ({ slug: normSlug(slugIn.value) || null, meta_description: (metaIn.value || "").trim() || null });

    card.querySelector('[data-act="preview"]').addEventListener("click", () => {
      if (prev.style.display === "block") { prev.style.display = "none"; return; }
      prev.innerHTML = md2html(ta.value || "（尚未撰寫 article_md）");
      prev.style.display = "block";
    });

    card.querySelector('[data-act="save"]').addEventListener("click", async () => {
      busy(true); setMsg("儲存中…");
      const { error } = await sb.from("mirofish_briefs")
        .update({ article_md: ta.value, status: "pending_review", reviewed_by: user.id, ...seoFields() })
        .eq("id", r.id);
      busy(false);
      if (error) return setMsg(/duplicate|unique/i.test(error.message) ? "儲存失敗：這個 slug 已被其他文章用了，請換一個" : "儲存失敗：" + error.message, true);
      setMsg("已存為待覆核 ✓");
    });

    card.querySelector('[data-act="publish"]').addEventListener("click", async () => {
      const txt = (ta.value || "").trim();
      if (txt.length < 200) { if (!confirm("article_md 內容偏少（<200 字），確定要發佈？")) return; }
      if (!/免責|非投資建議/.test(txt)) { if (!confirm("文章未偵測到免責聲明，仍要發佈？")) return; }
      if (!confirm("確定要『發佈』這篇？發佈後會公開可讀。")) return;
      busy(true); setMsg("發佈中…");
      const { error } = await sb.from("mirofish_briefs")
        .update({ article_md: ta.value, status: "published", reviewed_by: user.id, published_at: new Date().toISOString(), ...seoFields() })
        .eq("id", r.id);
      busy(false);
      if (error) return setMsg(/duplicate|unique/i.test(error.message) ? "發佈失敗：這個 slug 已被其他文章用了，請換一個" : "發佈失敗：" + error.message, true);
      setMsg("已發佈 ✓");
      setTimeout(load, 700);
    });

    // 重送自動把關：清掉 quality_flags.gate（attempts / stage_failed 一起歸零），
    // 下一輪 cron 的 runInsightAutopilot 就會重新撿起這篇。
    // ⚠ 只清 gate，不動上游 brief 自帶的其他旗標；也不碰 status（維持 draft）。
    const retryBtn = card.querySelector('[data-act="retry"]');
    if (retryBtn) retryBtn.addEventListener("click", async () => {
      if (!confirm("清掉把關紀錄，讓系統下一輪重新審一次？\n（適用於：規則調整過、或你已經改掉觸發的字）")) return;
      busy(true); setMsg("處理中…");
      const qf = Object.assign({}, r.quality_flags || {});
      delete qf.gate;
      const { error } = await sb.from("mirofish_briefs")
        .update({ quality_flags: Object.keys(qf).length ? qf : null })
        .eq("id", r.id);
      busy(false);
      if (error) return setMsg("失敗：" + error.message, true);
      setMsg("已重送 ✓ 下一輪（最多 10 分鐘）會重新審");
      setTimeout(load, 900);
    });

    card.querySelector('[data-act="reject"]').addEventListener("click", async () => {
      if (!confirm("確定要退回（rejected）？")) return;
      busy(true); setMsg("處理中…");
      const { error } = await sb.from("mirofish_briefs")
        .update({ status: "rejected", reviewed_by: user.id })
        .eq("id", r.id);
      busy(false);
      if (error) return setMsg("失敗：" + error.message, true);
      setMsg("已退回 ✓");
      setTimeout(load, 700);
    });
  }

  await load();
})();
</script>
</body>
</html>
