<script>
document.addEventListener("DOMContentLoaded", async () => {
  await window.LeadFu.ready;
  const L = window.LeadFu;
  const stocks = (L.data && L.data.stocks) || [];
  const byCode = {}; stocks.forEach(s => byCode[String(s.code)] = s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  const j = p => fetch(p).then(r => r.ok ? r.json() : null).catch(() => null);
  const [riskD, attD] = await Promise.all([j("/data/risk_score_live.json"), j("/data/attention_live.json")]);
  const RISK = (riskD && riskD.data) || {};
  const ATT = (attD && attD.data) || {};

  const d = new Date();
  const wd = ["日","一","二","三","四","五","六"][d.getDay()];
  document.getElementById("mDate").textContent = `${d.getMonth()+1}/${d.getDate()}（${wd}）`;

  // 健診分類：注意/處置 or 風險高 → 紅；風險中 or 分數明顯上升 → 橘
  function diagnose(code) {
    const out = { flag: null, why: [] };
    const a = ATT[code];
    const r = RISK[code];
    if (a) { out.flag = "r"; out.why.push(`列入${a.type || "注意"}股（${a.reason || ""}）`); }
    if (r) {
      if (r.level === "高" || r.level === "警示") { out.flag = "r"; out.why.push(...(r.reasons || []).slice(0, 2)); }
      else if (r.level === "中") { out.flag = out.flag || "a"; out.why.push(...(r.reasons || []).slice(0, 2)); }
      else if (r.prevScore != null && r.score != null && r.score - r.prevScore >= 12) {
        out.flag = out.flag || "a"; out.why.push(`風險分數上升 ${r.prevScore} → ${r.score}`);
      }
    }
    return out;
  }
  function tag(code) {
    const dg = diagnose(code);
    if (dg.flag === "r") return `<span class="m-tag risk">需注意</span>`;
    if (dg.flag === "a") return `<span class="m-tag warn">觀察</span>`;
    const r = RISK[code];
    if (r && r.level === "低") return `<span class="m-tag ok">低風險</span>`;
    return "";
  }

  let filter = "all";
  function refresh() {
    const wl = L.getWatchlist();
    const items = wl.map(c => ({ code: String(c), s: byCode[String(c)], dg: diagnose(String(c)) })).filter(x => x.s);
    const warn = items.filter(x => x.dg.flag);

    // Hero
    if (items.length) {
      document.getElementById("mTitle").innerHTML = warn.length
        ? `你的 ${items.length} 檔自選<br>今日 <i>${warn.length} 檔需注意</i>`
        : `你的 ${items.length} 檔自選<br>今日全部無異常 ✓`;
      document.getElementById("mSubT").textContent = `每天盤後，AI 自動幫你複查每一檔${L.hasSession && L.hasSession() ? "・☁ 已同步雲端" : ""}`;
    } else {
      document.getElementById("mTitle").textContent = "建立你的自選清單";
      document.getElementById("mSubT").textContent = "加入想追蹤的股票，AI 每天盤後幫你檢查風險";
    }

    // 健診卡
    const diag = document.getElementById("mDiag");
    if (items.length) {
      diag.style.display = "block";
      const rows = warn.slice(0, 6).map(x => `
        <a class="m-drow" href="/pages/check?code=${esc(x.code)}">
          <span class="m-dot ${x.dg.flag}"></span>
          <div class="m-dmain"><div class="m-dname">${esc(x.code)} ${esc(x.s.name)}</div><div class="m-dwhy">${esc(x.dg.why.slice(0, 2).join("、") || "需要留意")}</div></div>
          <span class="m-dgo">›</span>
        </a>`).join("");
      const okN = items.length - warn.length;
      document.getElementById("mDiagRows").innerHTML =
        (rows || "") + (okN > 0 ? `<div class="m-dok">${warn.length ? `其餘 ${okN} 檔今日無異常 ✓` : `${okN} 檔今日全部無異常 ✓`}</div>` : "");
    } else diag.style.display = "none";

    // 篩選 + 列表
    document.getElementById("mFilter").style.display = items.length ? "flex" : "none";
    document.querySelector('[data-f="all"]').textContent = `全部 ${items.length}`;
    document.querySelector('[data-f="warn"]').textContent = `需注意 ${warn.length}`;
    document.querySelector('[data-f="ok"]').textContent = `低風險 ${items.length - warn.length}`;

    let show = items;
    if (filter === "warn") show = warn;
    if (filter === "ok") show = items.filter(x => !x.dg.flag);
    const order = { r: 0, a: 1 };
    show = [...show].sort((x, y) => (order[x.dg.flag] ?? 2) - (order[y.dg.flag] ?? 2));

    document.getElementById("mList").innerHTML = show.length ? show.map(x => {
      const p = L.pctChange(x.s.price, x.s.change);
      const cls = (x.s.change||0) > 0 ? "up" : (x.s.change||0) < 0 ? "down" : "flat";
      return `<a class="m-row" href="/pages/stock-detail?code=${esc(x.code)}">
        <div class="m-main"><div class="m-name">${esc(x.s.name)} ${tag(x.code)}</div><div class="m-sub num">${esc(x.code)}・${esc(x.s.category || "")}</div></div>
        <div class="m-right num"><div class="m-price">${L.fmtPrice(x.s.price)}</div><div class="m-chg ${cls}">${p >= 0 ? "+" : ""}${p.toFixed(2)}%</div></div>
        <button class="m-del" data-c="${esc(x.code)}" aria-label="移除">✕</button>
      </a>`;
    }).join("") : `<div class="m-empty">${items.length ? "這個分類目前沒有股票" : "還沒有自選股。<br>用下方輸入框加入第一檔，例如 2330。"}</div>`;

    document.querySelectorAll(".m-del").forEach(b => b.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      L.removeFromWatchlist(b.dataset.c);
      refresh();
    }));
  }
  refresh();

  document.querySelectorAll(".m-fchip").forEach(c => c.addEventListener("click", () => {
    document.querySelectorAll(".m-fchip").forEach(x => x.classList.remove("on"));
    c.classList.add("on");
    filter = c.dataset.f;
    refresh();
  }));
  document.getElementById("mEdit").addEventListener("click", () => {
    document.body.classList.toggle("editing");
    document.getElementById("mEdit").textContent = document.body.classList.contains("editing") ? "完成" : "編輯";
  });

  // 新增
  const inp = document.getElementById("mAddInp"), sg = document.getElementById("mAddSugg");
  function add(code) {
    L.addToWatchlist(String(code));
    inp.value = ""; sg.style.display = "none";
    refresh();
    L.showToast && L.showToast(`已加入 ${code}`);
  }
  inp.addEventListener("input", () => {
    const q = inp.value.trim().toLowerCase();
    if (!q) { sg.style.display = "none"; return; }
    const hits = stocks.filter(s => String(s.code).toLowerCase().startsWith(q) || (s.name || "").toLowerCase().includes(q)).slice(0, 8);
    if (!hits.length) { sg.style.display = "none"; return; }
    sg.innerHTML = hits.map(s => `<div data-c="${esc(s.code)}"><b>${esc(s.code)}</b>　${esc(s.name)}<span style="color:#9a948a;font-size:12px;">　${L.isInWatchlist(String(s.code)) ? "已在自選" : ""}</span></div>`).join("");
    sg.style.display = "block";
    sg.querySelectorAll("div").forEach(el => el.addEventListener("click", () => add(el.dataset.c)));
  });
  document.getElementById("mAddBtn").addEventListener("click", () => {
    const q = inp.value.trim().toLowerCase();
    const f = stocks.find(s => String(s.code).toLowerCase() === q) || stocks.find(s => (s.name || "").toLowerCase() === q);
    if (f) add(f.code);
  });
  document.addEventListener("click", e => { if (!e.target.closest(".m-add")) sg.style.display = "none"; });
});
</script>
</body>
</html>
