<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市場洞察 Insights｜AI 輔助選題、經編輯查證 - 領富 AI</title>
<meta name="description" content="領富 AI 市場洞察：以 AI 輔助探勘題材方向，由編輯以公開來源（法說會／重訊／財報）查證後重寫。非投資建議。">
<link rel="canonical" href="https://leadfuai.com/insights">
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="stylesheet" href="../css/style.css?v=3.23.9">
<style>
  .in-wrap{max-width:820px;margin:0 auto;padding:24px 16px 80px;}
  .in-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:6px;}
  .in-title{font-size:24px;font-weight:800;color:#1B4332;}
  .in-title .ai{color:#B08D57;}
  .in-sub{color:#777;font-size:13px;margin-bottom:8px;}
  .in-note{font-size:12px;color:#8a6d3b;background:#f8f3e8;border:1px solid #e8dcc0;border-radius:8px;padding:8px 12px;margin-bottom:20px;}
  .in-card{background:#fff;border:1px solid #e8e4db;border-radius:12px;padding:20px 22px;margin-bottom:16px;box-shadow:0 2px 8px rgba(27,67,50,.04);}
  .in-h{font-size:19px;font-weight:800;color:#1B4332;margin:0 0 4px;}
  .in-h a{color:inherit;text-decoration:none;}
  .in-date{color:#aaa;font-size:12px;margin-bottom:10px;}
  .in-h a:hover{text-decoration:underline;}
  .in-excerpt{font-size:14.5px;line-height:1.8;color:#555;margin:0 0 10px;}
  .in-readmore{display:inline-block;color:#1B4332;font-weight:700;font-size:14px;text-decoration:none;}
  .in-readmore:hover{text-decoration:underline;}
  .in-body{font-size:15px;line-height:1.85;color:#333;}
  .in-body h1,.in-body h2,.in-body h3{color:#1B4332;line-height:1.4;}
  .in-body table{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0;}
  .in-body th,.in-body td{border:1px solid #e3e0d8;padding:5px 9px;text-align:left;}
  .in-foot{margin-top:14px;padding-top:10px;border-top:1px dashed #e3e0d8;font-size:12px;color:#999;}
  .in-state{text-align:center;padding:60px 20px;color:#888;}
  .in-state .ic{font-size:42px;margin-bottom:14px;}
</style>
</head>
<body>
<div class="in-wrap">
  <div class="in-head">
    <div class="in-title">市場洞察 <span class="ai">Insights</span></div>
    <a href="/" style="color:#1B4332;font-size:13px;">← 回首頁</a>
  </div>
  <div class="in-sub">產業題材與供應鏈框架解析</div>
  <div class="in-note">本欄文章以 AI 輔助探勘題材方向，再由編輯以公開來源（公司法說會／重大訊息／財報）查證後重寫。<b>內容為資訊整理，非投資建議</b>，不構成任何個股買賣推薦或報酬承諾。</div>
  <div id="inBody"><div class="in-state"><div class="ic">⏳</div>載入中…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(async () => {
  const SUPABASE_URL = "https://lhwxpnyzplylajxunlua.supabase.co";
  const SUPABASE_KEY = "sb_publishable_hBrtHt8ham91nuXSU_tdmA__BqcfIX1"; // 公開金鑰；RLS 只放行 status=published
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const el = document.getElementById("inBody");
  const esc = (s) => (s==null?"":String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])));
  const md2html = (s) => { try { return window.marked ? window.marked.parse(String(s||"")) : esc(s); } catch(e){ return esc(s); } };

  const { data, error } = await sb.from("mirofish_briefs")
    .select("id,slug,title_hint,thesis,meta_description,article_md,published_at")
    .eq("status", "published")
    .order("published_at", { ascending: false })
    .limit(50);

  if (error) {
    el.innerHTML = `<div class="in-state"><div class="ic">😕</div>暫時無法載入：${esc(error.message)}</div>`;
    return;
  }
  const rows = (data || []).filter(r => (r.article_md || "").trim());
  if (!rows.length) {
    el.innerHTML = `<div class="in-state"><div class="ic">📭</div>洞察文章即將上線，敬請期待。</div>`;
    return;
  }
  // 摘要：優先 meta_description → thesis →（去掉 markdown 符號的）article_md 開頭
  const excerpt = (r) => {
    const raw = r.meta_description || r.thesis ||
      String(r.article_md || "").replace(/[#>*`_\-\[\]()!]/g, " ").replace(/\s+/g, " ").trim();
    return String(raw).replace(/\s+/g, " ").trim().slice(0, 110);
  };
  // 每篇連到獨立 SEO 網址 /insights/{slug}（沒填 slug 用 id）
  el.innerHTML = rows.map(r => {
    const when = r.published_at ? new Date(r.published_at).toLocaleDateString("zh-TW") : "";
    const href = `/insights/${encodeURIComponent(r.slug || r.id)}`;
    return `<article class="in-card">
      <h2 class="in-h"><a href="${href}">${esc(r.title_hint || "市場洞察")}</a></h2>
      <div class="in-date">${when}</div>
      <p class="in-excerpt">${esc(excerpt(r))}…</p>
      <a class="in-readmore" href="${href}">閱讀全文 →</a>
    </article>`;
  }).join("");
})();
</script>
</body>
</html>
