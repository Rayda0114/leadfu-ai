<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>高殖利率排行 - 含配老本警示 - 領富 AI</title>
<meta name="description" content="台股高殖利率排行：附獨家「配老本」警示（配息來自公積或虧損仍配）、注意股與風險標記。高殖利率不等於穩賺，買前先看清楚。">
<link rel="canonical" href="https://leadfuai.com/pages/dividends">
<meta name="theme-color" content="#0b3328">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="stylesheet" href="/css/style.css?v=3.23.9">
<style>
  :root{
    --bg:#f4f2ec; --ink:#0d1d17; --muted:#68736c; --soft:#46534b;
    --hairline:rgba(13,29,23,.12); --hair2:rgba(13,29,23,.08);
    --forest:#0b3328; --paper:#fffdf8; --gold:#b9914f; --gold-2:#d6b36f;
    --up:#be4a3e; --down:#148a55; --flat:#8a948e; --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{font-size:16px;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:calc(76px + var(--safe-b));}
  .num{font-variant-numeric:tabular-nums;}

  .m-hero{color:#f8f5ec;padding:calc(20px + env(safe-area-inset-top)) 22px 54px;
    background:
      linear-gradient(160deg, rgba(255,255,255,.05) 0 1px, transparent 1px 100%),
      radial-gradient(circle at 86% 0%, rgba(185,145,79,.28), transparent 34%),
      linear-gradient(180deg,#08271f 0%, #0d3328 100%);
    background-size:19px 19px,auto,auto;}
  .m-hero-top{display:flex;justify-content:space-between;align-items:center;}
  .m-signal{display:inline-flex;align-items:center;gap:10px;font-size:11.5px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#d9bd82;}
  .m-signal::before{content:"";width:26px;height:1px;background:currentColor;}
  .m-date{font-size:12px;color:rgba(248,245,236,.55);font-weight:700;}
  .m-hero h1{margin:13px 0 0;font-size:27px;line-height:1.3;font-weight:900;letter-spacing:-.4px;}
  .m-hero p{margin:9px 0 0;font-size:13px;color:rgba(248,245,236,.66);line-height:1.7;max-width:320px;}

  .m-warn{margin:-32px 18px 0;position:relative;z-index:2;background:#fdf6ec;border:1px solid #f0e2c8;border-radius:18px;padding:14px 16px;box-shadow:0 16px 40px rgba(13,29,23,.14);}
  .m-warn b{display:block;font-size:13.5px;font-weight:900;color:#a8731c;}
  .m-warn p{margin:6px 0 0;font-size:12.5px;color:#7a6a4a;line-height:1.7;}
  .m-warn a{color:#a8731c;font-weight:900;text-decoration:none;}

  .m-stats{margin:12px 18px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .m-stat{background:var(--paper);border:1px solid var(--hair2);border-radius:16px;padding:12px 6px;text-align:center;}
  .m-stat b{display:block;font-size:19px;font-weight:900;color:var(--forest);}
  .m-stat b.amber{color:#a8731c;}
  .m-stat small{display:block;font-size:10.5px;color:#8a8d85;font-weight:800;margin-top:3px;}

  .m-sec{padding:18px 18px 0;}
  .m-sec-head{display:flex;justify-content:space-between;align-items:baseline;}
  .m-sec-head h2{margin:0;font-size:18px;font-weight:900;}
  .m-sec-head span{font-size:12px;color:#9a948a;font-weight:700;}
  .m-seg{display:flex;gap:7px;margin-top:12px;}
  .m-seg button{flex:1;min-height:40px;border-radius:999px;border:1px solid var(--hairline);background:transparent;font-family:inherit;font-size:13px;font-weight:800;color:var(--soft);cursor:pointer;}
  .m-seg button.on{background:var(--forest);border-color:var(--forest);color:#f4ead2;}

  .m-list{margin-top:12px;background:var(--paper);border:1px solid var(--hair2);border-radius:20px;overflow:hidden;}
  .m-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--hair2);min-height:66px;text-decoration:none;color:var(--ink);}
  .m-row:last-child{border-bottom:0;}
  .m-rank{width:22px;text-align:center;font-size:14px;font-weight:900;color:#c9b27e;font-style:italic;}
  .m-main{flex:1;min-width:0;}
  .m-name{font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .m-sub{font-size:11.5px;color:#a09a8c;font-weight:700;margin-top:3px;}
  .m-tag{font-size:10.5px;font-weight:900;padding:2px 7px;border-radius:8px;white-space:nowrap;}
  .m-tag.old{background:#fdf2dd;color:#a8731c;border:1px solid #ecd9b0;}
  .m-tag.warn{background:#fdf2dd;color:#a8731c;border:1px solid #ecd9b0;}
  .m-tag.risk{background:#fbeae8;color:#a13a2f;border:1px solid #eccfc9;}
  .m-right{text-align:right;flex:none;}
  .m-yld{font-size:17px;font-weight:900;color:#b08a3e;}
  .m-price{font-size:12px;font-weight:800;color:#8a8d85;margin-top:2px;}
  .m-more{display:block;text-align:center;padding:14px;font-size:13.5px;font-weight:900;color:var(--forest);background:none;width:100%;border:0;border-top:1px solid var(--hair2);font-family:inherit;cursor:pointer;}
  .m-empty{padding:24px;text-align:center;color:#8a8d85;font-size:13.5px;}

  .m-src{padding:18px 22px 8px;font-size:11.5px;color:#9a948a;line-height:1.7;}

  .m-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:900;display:flex;background:rgba(255,253,248,.96);backdrop-filter:blur(12px);border-top:1px solid var(--hairline);padding:8px 6px calc(8px + var(--safe-b));}
  .m-tabbar a{flex:1;text-align:center;text-decoration:none;color:#9a948a;font-size:10.5px;font-weight:800;}
  .m-tabbar svg{display:block;margin:0 auto 3px;}
  .m-tabbar a.on{color:var(--forest);}
</style>
</head>
<body>
<div class="bottom-tab-bar" style="display:none;"></div>

<header class="m-hero">
  <div class="m-hero-top">
    <span class="m-signal">Dividend Radar</span>
    <span class="m-date" id="mDate"></span>
  </div>
  <h1>高殖利率排行</h1>
  <p>附領富獨家<b style="color:#ecd9ab;">「配老本」警示</b> — 配息來自公積、或虧損仍硬配的，續航力要打問號。</p>
</header>

<section class="m-warn">
  <b>高殖利率 ≠ 穩賺</b>
  <p>殖利率高，有時是因為<b>股價大跌</b>（分母變小）或<b>一次性配息</b>。看到名單請先用 <a href="/pages/check-m">買前檢查</a> 確認營運與風險，再看「配老本」標記。領了股息要繳多少稅？<a href="/pages/dividend-tax" style="color:#a8731c;font-weight:900;">股利稅試算 →</a></p>
</section>

<div class="m-stats num" id="mStats"></div>

<section class="m-sec">
  <div class="m-sec-head"><h2>殖利率排行</h2><span>高 → 低</span></div>
  <div class="m-seg" id="mSeg">
    <button class="on" data-f="">全部（≥4%）</button>
    <button data-f="six">≥6%</button>
    <button data-f="safe">排除配老本＋注意股</button>
  </div>
  <div class="m-list" id="mList"><div class="m-empty">載入中…</div></div>
</section>

<div class="m-src">
  資料來源：TWSE・TPEx・MOPS（除權息與股利分派公告），盤後更新；殖利率依最近公告與收盤價估算，非投資建議。「配老本」＝配息含公積來源或本期淨損仍配息。
</div>

<nav class="m-tabbar">
  <a href="/" id="tbHome"></a>
  <a href="/pages/stocks-m" class="on" id="tbChart"></a>
  <a href="/pages/screener-m" id="tbSearch"></a>
  <a href="/pages/watchlist-m" id="tbStar"></a>
  <a href="/pages/member-m" id="tbUser"></a>
</nav>

<script src="/js/main.js?v=3.33.0"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  await window.LeadFu.ready;
  const L = window.LeadFu;
  const D = L.data || {};
  const byCode = {}; (D.stocks || []).forEach(s => byCode[String(s.code)] = s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  const tb = {
    tbHome: ['<path d="M216,120v96H152V152H104v64H40V120a8,8,0,0,1,2.34-5.66l80-80a8,8,0,0,1,11.32,0l80,80A8,8,0,0,1,216,120Z" fill="#c9a24b" opacity=".9"/><path d="M218.83,103.77l-80-75.48a1.14,1.14,0,0,1-.11-.11,16,16,0,0,0-21.53,0l-.11.11L37.17,103.77A16,16,0,0,0,32,115.55V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V160h32v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V115.55A16,16,0,0,0,218.83,103.77ZM208,208H160V160a16,16,0,0,0-16-16H112a16,16,0,0,0-16,16v48H48V115.55l.11-.1L128,40l79.9,75.43.11.1Z"/>', "首頁"],
    tbChart: ['<path d="M224,200h-8V40a8,8,0,0,0-8-8H160a8,8,0,0,0-8,8V80H104a8,8,0,0,0-8,8v40H48a8,8,0,0,0-8,8v64H32a8,8,0,0,0,0,16H224a8,8,0,0,0,0-16Z" fill="#c9a24b" opacity=".9"/><path d="M224,200h-8V40a8,8,0,0,0-8-8H160a8,8,0,0,0-8,8V80H104a8,8,0,0,0-8,8v40H48a8,8,0,0,0-8,8v64H32a8,8,0,0,0,0,16H224a8,8,0,0,0,0-16ZM168,48h32V200H168ZM112,96h40V200H112ZM56,144H96v56H56Z"/>', "行情"],
    tbSearch: ['<circle cx="112" cy="112" r="80" fill="#c9a24b" opacity=".9"/><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/>', "選股"],
    tbStar: ['<path d="M229.06,108.79l-48.7,42,14.88,62.79a8.4,8.4,0,0,1-12.52,9.17L128,189.09,73.28,222.74a8.4,8.4,0,0,1-12.52-9.17l14.88-62.79-48.7-42A8.46,8.46,0,0,1,31.73,94l63.91-5.2,24.62-59.6a8.36,8.36,0,0,1,15.48,0l24.62,59.6L224.27,94A8.46,8.46,0,0,1,229.06,108.79Z" fill="#c9a24b" opacity=".9"/><path d="M239.18,97.26A16.38,16.38,0,0,0,224.92,86l-59-4.76L143.14,26.15a16.36,16.36,0,0,0-30.27,0L90.11,81.23,31.08,86a16.46,16.46,0,0,0-9.37,28.86l45,38.83L53,211.75a16.38,16.38,0,0,0,24.5,17.82L128,198.49l50.53,31.08A16.4,16.4,0,0,0,203,211.75l-13.76-58.07,45-38.83A16.43,16.43,0,0,0,239.18,97.26Zm-15.34,5.47-48.7,42a8,8,0,0,0-2.56,7.91l14.88,62.8a.37.37,0,0,1-.17.48c-.18.14-.23.11-.38,0l-54.72-33.65a8,8,0,0,0-8.38,0L69.09,215.94c-.15.09-.19.12-.38,0a.37.37,0,0,1-.17-.48l14.88-62.8a8,8,0,0,0-2.56-7.91l-48.7-42c-.12-.1-.23-.19-.13-.5s.18-.27.33-.29l63.92-5.16A8,8,0,0,0,103,91.86l24.62-59.61c.08-.17.11-.25.35-.25s.27.08.35.25L153,91.86a8,8,0,0,0,6.75,4.92l63.92,5.16c.15,0,.24,0,.33.29S224,102.63,223.84,102.73Z"/>', "自選"],
    tbUser: ['<circle cx="128" cy="96" r="64" fill="#c9a24b" opacity=".9"/><path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"/>', "我的"],
  };
  for (const [id, [paths, label]] of Object.entries(tb)) {
    document.getElementById(id).innerHTML = `<svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor">${paths}</svg>${label}`;
  }

  const d = new Date();
  const wd = ["日","一","二","三","四","五","六"][d.getDay()];
  document.getElementById("mDate").textContent = `${d.getMonth()+1}/${d.getDate()}（${wd}）`;

  const VAL = D.valuation || {};
  const DIV = D.dividend || {};
  const ATT = D.attention || {};
  const RISK = D.riskScore || {};

  const all = Object.entries(VAL)
    .filter(([c, v]) => typeof v.yield_pct === "number" && v.yield_pct >= 4 && byCode[c] && byCode[c].price > 0)
    .map(([c, v]) => ({ c, v, s: byCode[c], dv: DIV[c] }))
    .sort((a, b) => b.v.yield_pct - a.v.yield_pct);
  const oldN = all.filter(x => x.dv && x.dv.oneoff).length;
  const sixN = all.filter(x => x.v.yield_pct >= 6).length;

  document.getElementById("mStats").innerHTML = `
    <div class="m-stat"><b>${all.length}</b><small>殖利率 ≥4%</small></div>
    <div class="m-stat"><b>${sixN}</b><small>殖利率 ≥6%</small></div>
    <div class="m-stat"><b class="amber">${oldN}</b><small>含配老本警示</small></div>`;

  function tags(x) {
    let h = "";
    if (x.dv && x.dv.oneoff) h += `<span class="m-tag old">配老本</span>`;
    const a = ATT[x.c];
    if (a) h += `<span class="m-tag warn">${esc(a.type || "注意")}</span>`;
    const r = RISK[x.c];
    if (r && (r.level === "高" || r.level === "極高" || r.level === "警示")) h += `<span class="m-tag risk">高風險</span>`;
    return h;
  }
  function isSafe(x) {
    if (x.dv && x.dv.oneoff) return false;
    if (ATT[x.c]) return false;
    const r = RISK[x.c];
    return !(r && (r.level === "高" || r.level === "極高" || r.level === "警示"));
  }

  let filter = "", shown = 50;
  function render() {
    let arr = all;
    if (filter === "six") arr = arr.filter(x => x.v.yield_pct >= 6);
    if (filter === "safe") arr = arr.filter(isSafe);
    const list = arr.slice(0, shown);
    document.getElementById("mList").innerHTML = (list.map((x, i) => {
      const divTxt = x.dv && x.dv.cash ? `現金股利 ${x.dv.cash} 元${x.dv.ex_month ? `・${x.dv.ex_month} 月除息` : "・除息待公告"}` : "依最近年度估算";
      return `<a class="m-row" href="/pages/stock-m?code=${esc(x.c)}">
        <div class="m-rank">${i + 1}</div>
        <div class="m-main">
          <div class="m-name">${esc(x.s.name)} ${tags(x)}</div>
          <div class="m-sub num">${esc(x.c)}・${esc(x.s.category || "")}・${esc(divTxt)}</div>
        </div>
        <div class="m-right num"><div class="m-yld">${x.v.yield_pct.toFixed(2)}%</div><div class="m-price">${L.fmtPrice(x.s.price)} 元</div></div>
      </a>`;
    }).join("") || `<div class="m-empty">這個條件目前沒有股票</div>`) +
    (arr.length > shown ? `<button class="m-more" id="mMore">顯示更多（${shown} / ${arr.length}）▾</button>` : "");
    const mb = document.getElementById("mMore");
    if (mb) mb.addEventListener("click", () => { shown += 50; render(); });
  }
  render();
  document.querySelectorAll("#mSeg button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("#mSeg button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    filter = b.dataset.f; shown = 50; render();
  }));
});
</script>
</body>
</html>
