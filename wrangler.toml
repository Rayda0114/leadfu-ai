name = "leadfu-ai"
compatibility_date = "2024-09-23"
main = "worker.js"
compatibility_flags = ["nodejs_compat"]

# 綠界商店代號（非密鑰，可公開）— 寫進設定檔，避免 wrangler deploy 洗掉「文字」型變數
# HashKey / HashIV 仍為 Cloudflare 機密（不放這），部署不會清掉
[vars]
ECPAY_MERCHANT_ID = "3501534"

[assets]
directory = "."
binding = "ASSETS"

# Cloudflare 定時觸發：每日盤後新聞推播（準時 15:50 台北 = 07:50 UTC，不受 GitHub Actions 排程延遲）
# 盤前(07:40)仍走 GitHub workflow（需先抓當日最新新聞）。
[triggers]
crons = ["50 7 * * 1-5"]
