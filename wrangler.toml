name = "leadfu-ai"
compatibility_date = "2024-09-23"
main = "worker.js"
compatibility_flags = ["nodejs_compat"]

# 綠界商店代號（非密鑰，可公開）— 寫進設定檔，避免 wrangler deploy 洗掉「文字」型變數
# HashKey / HashIV 仍為 Cloudflare 機密（不放這），部署不會清掉
[vars]
ECPAY_MERCHANT_ID = "3501534"

[assets]
directory = "."
binding = "ASSETS"
# 讓所有請求都走 worker（不然靜態 index.html 會被 Cloudflare 直接服務，手機判斷攔不到「/」）
experimental_serve_directly = false

# Cloudflare 定時觸發（準時，不受 GitHub Actions 排程延遲）：
#   00:30 UTC = 08:30 台北 → 盤前新聞推播（開盤前送達）；新聞由 GitHub 清晨先抓好並部署到站。
#   07:50 UTC = 15:50 台北 → 盤後新聞推播。
[triggers]
crons = ["30 0 * * 1-5", "50 7 * * 1-5"]
